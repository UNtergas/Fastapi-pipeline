[project]
name = "router"
version = "0.1.0"
description = "Task classification + routing demo"
authors = [
    { name = "UNtergas", email = "mycomputerer135@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "datasets>=5.0.1",
    "fastapi[standard]>=0.141.1",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src"]